<!--
  Et år i Norge – Übungswebseite (siehe SPEC.md und TASKS.md)

  Öffnen: diese Datei einfach per Doppelklick im Browser öffnen
  (file://…). Kein Server, keine Installation nötig.

  Neue Übungsaufgaben ergänzen: eine bestehende Datei unter data/
  öffnen (z. B. data/aufgaben-adjektive.js) und ein weiteres Objekt in
  das Array einfügen, oder eine neue Datei data/aufgaben-<thema>.js
  nach demselben Muster anlegen und hier per <script src="…"> vor
  js/app.js einbinden. Datenschema, Vokabelregel (nur Wörter bis zur
  jeweiligen Lektion aus vokabeln/) und Beispiele: siehe SPEC.md
  Abschnitt 5 und 10.
-->
